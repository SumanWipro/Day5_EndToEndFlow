name: Python CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ── Stage 1: Build ───────────────────────────────────────────────────────────
  # Lint the code and produce a distributable wheel + sdist.
  # All downstream stages consume the artifact produced here.
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 calculator/ main.py --max-line-length=100 --exclude=.venv

      - name: Build package
        run: python -m build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

  # ── Stage 2: Test ────────────────────────────────────────────────────────────
  # Download the built artifact and run the full test suite with coverage.
  # Fails the pipeline if coverage drops below 60%.
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=calculator --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # ── Stage 3: Deploy ──────────────────────────────────────────────────────────
  # Runs only on push to main (not on PRs) after tests pass.
  # Publishes a versioned GitHub Release with the built wheel and sdist.
  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          body: |
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message }}

            ### Artifacts
            - `.whl` — installable wheel (`pip install calculator-*.whl`)
            - `.tar.gz` — source distribution
          files: dist/*
